services:

  backend_full:
    build:
      context: ./backend_full
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cavina}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-cavina}
      JWT_SECRET_KEYS: ${JWT_SECRET_KEYS:?JWT_SECRET_KEYS is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      STRUCTLOG_JSON: ${STRUCTLOG_JSON:-false}
      BOOTSTRAP_DEFAULT_ADMIN: ${BOOTSTRAP_DEFAULT_ADMIN:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      - db
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data:rw
    env_file:
      - .env

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cavina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cavina}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./data:/docker-entrypoint-initdb.d:rw



  #frontend:
  #  build:
  #    context: ./frontend
  #    dockerfile: Dockerfile.dev
  #  ports:
  #    - "8088:4000"
  #  depends_on:
  #    - backend_full

  #front:
  #  build:
  #    context: ./front
  #    dockerfile: Dockerfile
  #  ports:
  #    - "8090:80"
  #  depends_on:
  #    - backend_full

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    ports:
      - "8090:5173"
    volumes:
      - ./front:/app
      - ./data/product_images:/app/public/images:r
      - /app/node_modules
    environment:
      - NODE_ENV=development

volumes:
  pgdata:
  pgdata_simple:
